name: Spike or decision
description: Time-box uncertainty and end with evidence and a recommendation.
title: "[Spike] "
labels:
  - type:spike
  - needs:decision
body:
  - type: textarea
    id: question
    attributes:
      label: Decision question
      placeholder: What specific uncertainty must be resolved?
    validations:
      required: true
  - type: textarea
    id: options
    attributes:
      label: Options under consideration
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence required
      placeholder: Prototype, documentation, user test, benchmark, or risk analysis.
    validations:
      required: true
  - type: dropdown
    id: timebox
    attributes:
      label: Time box
      options:
        - 30 minutes
        - 1 hour
        - 2 hours
        - Half day
        - One day
    validations:
      required: true
  - type: textarea
    id: exit
    attributes:
      label: Exit artifact
      placeholder: Recommendation, decision record, prototype, or rejected options.
    validations:
      required: true
